<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Ответы</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #111;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }

  #screen1 {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 30px; padding: 40px 20px;
    transition: opacity 0.5s ease;
    z-index: 2;
  }
  #screen1.hide { opacity: 0; pointer-events: none; }

  #revealBtn {
    position: absolute; top: 30px; left: 50%;
    transform: translateX(-50%);
    font-size: clamp(1rem, 3vw, 1.5rem);
    font-weight: 900; letter-spacing: 2px;
    text-transform: uppercase;
    padding: 14px 40px;
    border: 3px solid #ffc800; border-radius: 50px;
    background: transparent; color: #ffc800;
    cursor: pointer;
    transition: background 0.25s, color 0.25s, box-shadow 0.25s;
  }
  #revealBtn:hover {
    background: #ffc800; color: #111;
    box-shadow: 0 0 30px rgba(255, 200, 0, 0.7);
  }

  #screen2 {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 30px; padding: 40px 20px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.6s ease;
    z-index: 1;
  }
  #screen2.show { opacity: 1; pointer-events: auto; }

  .sign { width: min(45vw, 260px); height: auto; }
  .sign .bar, .sign .dot { fill: #ffc800; }

  .bigText {
    color: #ffc800; font-weight: 900;
    text-align: center; text-transform: uppercase;
    letter-spacing: 3px; line-height: 1.2;
    max-width: 90vw;
  }
  #text1 { font-size: clamp(1.6rem, 5vw, 4rem); }
  #text2 { font-size: clamp(2rem, 7vw, 5.5rem); }

  @keyframes softPulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.55; }
  }
  .pulse { animation: softPulse 1.2s ease-in-out infinite; }
</style>
</head>
<body>

<div id="screen1">
  <button id="revealBtn">Раскрыть ответы</button>
  <svg class="sign" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
    <rect class="bar" x="55" y="20" width="90" height="240" rx="20"/>
    <circle class="dot" cx="100" cy="350" r="45"/>
  </svg>
  <div id="text1" class="bigText">эээ, это задание, и ты должен(на) думать сам(а)</div>
</div>

<div id="screen2">
  <svg class="sign pulse" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
    <rect class="bar" x="55" y="20" width="90" height="240" rx="20"/>
    <circle class="dot" cx="100" cy="350" r="45"/>
  </svg>
  <div id="text2" class="bigText">я же говорил, думай</div>
</div>

<script>
  const screen1 = document.getElementById('screen1');
  const screen2 = document.getElementById('screen2');
  const btn = document.getElementById('revealBtn');

  let audioCtx, osc, lfo, lfoGain, vol, filter;

  function startSiren() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // Основной тон — пила, звучит резко, по-сиренному
    osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.value = 900;

    // Качание частоты: быстро и глубоко
    lfo = audioCtx.createOscillator();
    lfo.type = 'triangle';       // треугольник даёт более "механическое" качание
    lfo.frequency.value = 2.2;   // 2.2 Гц — быстрое "виу-виу-виу"

    lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 500;    // ±500 Гц вокруг 900

    // Фильтр, чтобы убрать слишком резкие верха — но оставить "сиренность"
    filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 2500;
    filter.Q.value = 2;

    vol = audioCtx.createGain();
    vol.gain.value = 0;

    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);
    osc.connect(filter);
    filter.connect(vol);
    vol.connect(audioCtx.destination);

    // плавное нарастание до умеренной громкости
    vol.gain.setValueAtTime(0, audioCtx.currentTime);
    vol.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 1.2);

    osc.start();
    lfo.start();
  }

  btn.addEventListener('click', () => {
    screen1.classList.add('hide');
    screen2.classList.add('show');
    startSiren();
  });
</script>

</body>
</html>
